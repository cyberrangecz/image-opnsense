include:
  - project: muni-kypo-images/ci-cd-virtual-images
    file: .gitlab-ci-template.yml

variables:
  NAME: "opnsense"
  TYPE: "linux"
  DISTRO: "freebsd"


build-qemu:
  before_script:
    - if [ ! -f opnsense.iso ]; then
    -  wget -nv https://opnsense.c0urier.net/releases/22.7/OPNsense-22.7-OpenSSL-dvd-amd64.iso.bz2 -O opnsense.iso.bz2
    -  bunzip2 opnsense.iso.bz2
    - fi
