# OPNsense overrides of the FreeBSD defaults in /usr/local/etc/cloud/cloud.cfg

# If you use datasource_list array, keep array items in a single line.
# If you use multi line array, ds-identify script won't read array items.
datasource_list: ['NoCloud', 'ConfigDrive', 'OpenStack', 'Azure', 'Ec2']

manage_etc_hosts: localhost

system_info:
  default_user:
    # admins is the OPNsense administrators group
    groups: [admins, wheel]

# The default user is registered in /conf/config.xml by
# /var/lib/cloud/scripts/per-instance/opnsense-user.sh
